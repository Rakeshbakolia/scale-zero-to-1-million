services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: scalelab
      POSTGRES_PASSWORD: scalelab
      POSTGRES_DB: scalelab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalelab -d scalelab"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
